# Dependabot: weekly, Monday 06:00 America/New_York (org convention).
#
# Actions are pinned by tag today; each merged bump is the moment to re-pin.
# Docker base images are pinned by DIGEST in images/bases.tsv, which Dependabot
# does not read -- repinning those is a deliberate act, described in
# docs/guides/release.md, because a moved base is a rebuild-and-reverify.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  # The Go module (design.md D-68). go.sum is committed; no lock file is.
  - package-ecosystem: gomod
    directory: /src
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      gomod-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
