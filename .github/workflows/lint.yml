name: Static analysis

on:
  pull_request:

  workflow_dispatch:
permissions:
  contents: read

# Our own Go module is fetched from git, never through proxy.golang.org or
# sum.golang.org, so a CI build never feeds a version into the public cache.
env:
  GOPRIVATE: github.com/simtabi/*
  GONOSUMDB: github.com/simtabi/*

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned by tag today, not yet by commit (see .github/dependabot.yml);
      # a moved tag is how the tj-actions and trivy-action attacks spread, so
      # re-pinning to a SHA is the open follow-up.
      - uses: actions/checkout@v7
        with:
          # No job in this workflow pushes, so the token has no business
          # outliving the checkout step. Without this, checkout writes the
          # credential into .git/config, where any later step -- or anything
          # that archives the workspace -- can read it.
          persist-credentials: false

      # PINNED, not apt's.
      #
      # Ubuntu ships an older shellcheck than developers install locally, and
      # the two disagree: the runner rejected SC2015 patterns that shellcheck
      # 0.11 no longer reports, so `make lint` passed on a laptop and failed in
      # CI. A gate that disagrees with the gate people run before pushing is
      # worse than no gate -- it teaches them to push and see.
      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          set -euo pipefail
          curl -fsSL -o sc.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          tar -xJf sc.tar.xz
          sudo install -m 0755 "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: Lint every shell script
        run: make lint

  harness-structure:
    name: harness structure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned by tag today, not yet by commit (see .github/dependabot.yml);
      # a moved tag is how the tj-actions and trivy-action attacks spread, so
      # re-pinning to a SHA is the open follow-up.
      - uses: actions/checkout@v7
        with:
          # No job in this workflow pushes, so the token has no business
          # outliving the checkout step. Without this, checkout writes the
          # credential into .git/config, where any later step -- or anything
          # that archives the workspace -- can read it.
          persist-credentials: false

      # The harness must be well-formed even while the features it checks do
      # not exist yet. This is the gate that stays green through every phase.
      - name: Validate the verify harness
        run: make verify-structure

  # ---------------------------------------------------------------------------
  # The Go module in src/ (design.md D-68): format, vet, race tests (the
  # policy test forbids InsecureSkipVerify, http.DefaultClient, pprof and
  # expvar), golangci-lint with gosec, govulncheck, then the structure checks
  # that read the manifest. Linux only; nothing here builds a release.
  # ---------------------------------------------------------------------------
  go:
    name: go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The module is src/; its go.mod names the toolchain.
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Format, vet, test
        run: make go-ci

      # Built with the runner's Go 1.27, so the linter understands the stdlib
      # it analyses; a release binary built with an older Go can panic on it.
      - name: Lint
        run: make go-lint

      - name: Known vulnerabilities
        run: go -C src run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      # The checks that compare the manifest with engine-lib.sh, ci-matrix,
      # the chart and the test overlay. 66 renders Compose config, which needs
      # the Compose CLI the runner ships, and no daemon.
      # 67 checks build/ after a real build: one folder per OS, nothing else.
      - name: Manifest and build-layout checks
        run: |
          make dbpantry
          make verify CHECKS=31,62,63,65,66,67
