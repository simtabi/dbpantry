name: Release

# The contract is docs/guides/release.md. A release runs in two ways, and no other:
#
#   git push origin vX.Y.Z                                               releases vX.Y.Z
#   gh workflow run release.yml --repo simtabi/dbpantry -f tag=vX.Y.Z     the same, for a tag already pushed
#
# Push a version tag only for final code: tags are final, and a pushed tag releases.
# A release publishes the GitHub release only: the notes and the source tarball, with
# its checksum and provenance. Container images are no longer published (owner,
# 2026-11-13: GitHub release only); the images on ghcr.io/simtabi are frozen. Every
# image is still built and scanned, and `make verify` still runs, before the release.
# src/internal/release's TestReleaseRunsOnAVersionTagOrOnRequest fails if this gains
# any other trigger, stops gating or checking out the tag, or publishes an image.
#
# dbpantry builds no release binaries, so it keeps its own jobs rather than calling
# simtabi/.github's shared go-release.yml, which runs GoReleaser.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: An existing vX.Y.Z tag to release
        required: true
        type: string

permissions:
  contents: read

# Our own Go module is fetched from git, never through proxy.golang.org or
# sum.golang.org, so a release build never feeds a version into the public
# cache (make verify builds the dbpantry binary).
env:
  GOPRIVATE: github.com/simtabi/*
  GONOSUMDB: github.com/simtabi/*

# One run per tag, never cancelled: two runs must not publish the same release,
# and a partly published release is worse than a slow one.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # What is being released, and whether it may be.
  #
  # Everything that can refuse cheaply refuses here, before a single image is
  # built: a tag that is not a version on GitHub, a tag that is not on main, a
  # version with no CHANGELOG section, or a matrix that includes MongoDB.
  # ---------------------------------------------------------------------------
  prepare:
    name: resolve release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      images: ${{ steps.matrix.outputs.images }}
    steps:
      # The release gate, before anything is checked out or built. Every other
      # job needs this one, so a refusal here publishes nothing. The tag comes
      # from the pushed ref or the dispatch's tag input, and it must be a version
      # tag already on GitHub: every later job checks out that tag, never a branch.
      - name: Refuse anything but a vX.Y.Z tag on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::refusing to publish: '${TAG}' is not a vX.Y.Z tag"
            exit 1
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --silent; then
            echo "::error::refusing to publish: ${TAG} is not a tag on ${GITHUB_REPOSITORY}; push it first"
            exit 1
          fi

      # GitHub's own actions float on their major tag, per the Simtabi action
      # rule: a commit pin is for actions whose tag a third party controls.
      # Everything third-party here is a checksum-verified binary instead.
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          # Full history: the tag must be checked against main below.
          fetch-depth: 0
          # No step in this job pushes, so the token is not kept in .git/config.
          persist-credentials: false

      - id: release
        name: Resolve the version from the tag
        run: |
          set -euo pipefail
          # The gate admits a pre-release suffix; a dbpantry release is a final
          # version only, so this is the real test.
          [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] \
            || { echo "::error::tag $TAG is not vX.Y.Z"; exit 1; }
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # "Nothing is published from a branch": a tag pushed on a feature branch
      # would otherwise release code that main never reviewed.
      # HEAD is the tag's commit (checked out above). GITHUB_SHA is not: on a
      # dispatch it is the branch the run was started from.
      - name: Refuse a tag that is not on main
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "::error::$TAG points at a commit that is not on main"; exit 1; }

      # The release body is that version's CHANGELOG section. Checked here, so a
      # missing section fails in seconds rather than after an hour of builds.
      - name: Require a CHANGELOG section for the version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: scripts/release-notes "$VERSION" > /dev/null

      # The same descriptor-derived matrix ci.yml builds, plus the cli image, for
      # the scan gate. MongoDB is referenced, never derived (docs/guides/licensing.md),
      # so ci-matrix leaves it out; this step fails rather than trusts that.
      - id: matrix
        name: Resolve the images to scan
        run: |
          set -euo pipefail
          images="$(scripts/ci-matrix versions | jq -c '. + [{"engine":"cli","version":"dev"}]')"
          if jq -e 'any(.[]; .engine == "mongodb")' <<<"$images" >/dev/null; then
            echo "::error::the matrix includes MongoDB, which is SSPL-licensed and never derived"
            exit 1
          fi
          echo "images=$images" >> "$GITHUB_OUTPUT"
          jq -r '.[] | "\(.engine) \(.version)"' <<<"$images"

  # ---------------------------------------------------------------------------
  # Gate 1: every image builds and passes the Trivy gate on both architectures.
  #
  # Images are no longer published, but they are the toolkit's product and every
  # user builds them with `make build`, so a release still refuses a tag whose
  # images do not build or carry a fixable HIGH or CRITICAL finding.
  # ---------------------------------------------------------------------------
  scan:
    name: scan ${{ matrix.entry.engine }} ${{ matrix.entry.version }} (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        entry: ${{ fromJSON(needs.prepare.outputs.images) }}
        arch: [amd64, arm64]
        # Native runners only. There is no emulated build: an image that
        # cannot be built on arm64 fails the release rather than shipping as
        # a QEMU build (docs/guides/release.md).
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Build ${{ matrix.entry.engine }} ${{ matrix.entry.version }}
        env:
          ENGINE: ${{ matrix.entry.engine }}
          VERSION: ${{ matrix.entry.version }}
        run: |
          set -euo pipefail
          cp .env.example .env
          # The version is chosen the way `make build` chooses it, through .env.
          # The cli image has no version variable; scripts/build tags it `dev`.
          if [ "$ENGINE" != "cli" ]; then
            upper="$(printf '%s' "$ENGINE" | tr '[:lower:]-' '[:upper:]_')"
            sed -i "s/^MDB_${upper}_VERSION=.*/MDB_${upper}_VERSION=${VERSION}/" .env
          fi
          scripts/build "$ENGINE"

      # The trivy BINARY, pinned and checksum-verified, for the reason given in
      # ci.yml: 75 of trivy-action's 76 tags were force-pushed in March 2026.
      - name: Install trivy
        env:
          TRIVY_VERSION: 0.73.0
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)  t_arch=64bit ;;
            aarch64) t_arch=ARM64 ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          tarball="trivy_${TRIVY_VERSION}_Linux-${t_arch}.tar.gz"
          curl -fsSL -o "$tarball" "${base}/${tarball}"
          curl -fsSL -o checksums.txt "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" trivy
          sudo mv trivy /usr/local/bin/
          trivy --version

      # The same gate as ci.yml, with the same waivers file: HIGH and CRITICAL
      # with a known fix fail; an expired waiver no longer applies.
      - name: Scan ${{ matrix.entry.engine }} ${{ matrix.entry.version }}
        env:
          ENGINE: ${{ matrix.entry.engine }}
          VERSION: ${{ matrix.entry.version }}
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile .trivyignore.yaml --exit-code 1 --format table \
            "localhost/dbpantry-${ENGINE}:${VERSION}"

  # ---------------------------------------------------------------------------
  # Gate 2: the acceptance harness, on both architectures.
  #
  # `make verify` is the definition of done (docs/guides/release.md). The tagged
  # commit passed it as a pull request, but a release does not rest on a run
  # it cannot see: the bases or the waivers' dates may have moved since.
  # ---------------------------------------------------------------------------
  verify:
    name: verify (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      # Same pinned version as lint.yml; see the note there.
      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          set -euo pipefail
          curl -fsSL -o sc.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.$(uname -m).tar.xz"
          tar -xJf sc.tar.xz
          sudo install -m 0755 "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck

      - name: Confirm docker is available
        run: docker info

      - name: Harness structure
        run: make verify-structure

      - name: Initialise the checkout
        run: make init

      - name: Build the engine images
        run: make build

      - name: Full acceptance harness
        run: make verify

      - name: Container logs on failure
        if: failure()
        run: |
          docker ps -a --format '{{.Names}}\t{{.Status}}'
          for c in $(docker ps -aq); do
            echo "=== $(docker inspect -f '{{.Name}}' "$c") ==="
            docker logs --tail 50 "$c" 2>&1 || true
          done

  # ---------------------------------------------------------------------------
  # The GitHub release, last: only once every image has built and passed the
  # scan, and `make verify` has passed on both architectures.
  #
  # The body is the version's CHANGELOG section with the contributors since
  # the previous tag appended (docs/guides/release.md), and the source tarball is
  # attached with its checksum and provenance.
  # ---------------------------------------------------------------------------
  release:
    name: GitHub release
    needs: [prepare, scan, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write          # create the release
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Write the release notes and the source tarball
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          scripts/release-notes "$VERSION" > notes.md
          prev="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          range="${prev:+${prev}..}${TAG}"
          {
            printf '\n### Contributors\n\n'
            git log --format='%aN' "$range" | grep -v '\[bot\]$' | sort -fu | sed 's/^/- /'
          } >> notes.md
          git archive --format=tar.gz --prefix="dbpantry-${VERSION}/" \
            -o "dbpantry-${VERSION}.tar.gz" "$TAG"
          sha256sum "dbpantry-${VERSION}.tar.gz" > "dbpantry-${VERSION}.tar.gz.sha256"
          cat notes.md

      - name: Attach the build provenance to the tarball
        uses: actions/attest@v4
        with:
          subject-path: dbpantry-${{ needs.prepare.outputs.version }}.tar.gz

      - name: Create the release
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md \
            "dbpantry-${VERSION}.tar.gz" "dbpantry-${VERSION}.tar.gz.sha256"
