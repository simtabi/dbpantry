{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-dbpantry
  labels:
    app.kubernetes.io/name: dbpantry
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  # Every dbpantry pod of this release: engines, HA members, backup jobs.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dbpantry
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        # Pods in this namespace (the apps of the project, and dbpantry itself).
        - podSelector: {}
        {{- with .Values.networkPolicy.extraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
