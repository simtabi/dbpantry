# dbpantry engine descriptor: PostgreSQL
#
# Shell key-value, not YAML: every consumer here is bash, and a format needing
# yq would add a dependency the toolkit does not otherwise have.

MDB_ENGINE_NAME=pg
MDB_ENGINE_TITLE="PostgreSQL"
MDB_ENGINE_FAMILY=postgres
MDB_ENGINE_PARADIGM=relational

# Maintained versions only: the newest major and the one before it, both
# inside the community's five-year support window (design.md D-57,
# docs/guides/versions.md). 15 and 16 are still supported upstream but no longer
# maintained here; run one through MDB_PG_BASE_IMAGE, unsupported.
#   https://www.postgresql.org/support/versioning/
MDB_ENGINE_VERSIONS="17 18"
MDB_ENGINE_DEFAULT_VERSION=17

MDB_ENGINE_PORT=5432
MDB_ENGINE_HOST_PORT_DEFAULT=5432
# Offset from MDB_PORT_BASE when publishing. Explicit rather than derived from
# the engine's own port: 27017 + a 54000 base is 81017, past the end of the
# port range. Explicit offsets are always valid and do not shift when another
# engine is added. Check 31 asserts they are unique.
MDB_ENGINE_PORT_OFFSET=0
# PG 18 moved this to /var/lib/postgresql; check-env enforces the pairing.
MDB_ENGINE_DATA_DIR=/var/lib/postgresql/data
MDB_ENGINE_SOCKET_DIR=/var/run/postgresql
MDB_ENGINE_USER=postgres
MDB_ENGINE_ROOT_SECRET=pg_superuser_password.txt

MDB_ENGINE_PING='pg_isready -U postgres'
MDB_ENGINE_CLIENT=psql
MDB_ENGINE_SHELL='psql -h /var/run/postgresql -U postgres'

# -Fc is the custom format: compressible and selectively restorable.
MDB_ENGINE_DUMP='pg_dump -U postgres -Fc --no-password'
# Roles and grants live ONLY here. A per-database dump restores into a server
# nobody can log into, so this runs on every backup without exception.
MDB_ENGINE_DUMP_GLOBALS='pg_dumpall -U postgres --globals-only --no-password'
MDB_ENGINE_RESTORE='pg_restore -U postgres --no-owner --clean --if-exists'
MDB_ENGINE_BACKUP_EXT=dump

MDB_ENGINE_AUTH_METHOD=scram-sha-256
MDB_ENGINE_TLS_ALWAYS=true

MDB_ENGINE_POOLING=external
# Built here, not pulled from a third party: pgBouncer publishes no official
# image, and edoburu/pgbouncer was this toolkit's only community rebuild.
# images/pgbouncer/Dockerfile builds it from a Docker Official base plus the
# PGDG package. See docs/reference/image-provenance.md.
MDB_ENGINE_POOLER_IMAGE='ghcr.io/simtabi/dbpantry-pgbouncer:dev'
MDB_ENGINE_POOLER_BUILD=pgbouncer/Dockerfile
# Every pooler starts through a script in the repository. Note it must exec the
# image's own entrypoint AND its CMD: overriding a service's entrypoint discards
# the CMD, and without restating it pgBouncer generates its config and exits 0 --
# a pooler that "started successfully" and is not listening.
MDB_ENGINE_POOLER_CMD=/usr/local/bin/mdb-pgbouncer-bootstrap
MDB_ENGINE_POOLER_PORT=6432
MDB_ENGINE_POOLER_HOST_PORT_DEFAULT=6432
MDB_ENGINE_POOLER_SECRET=pgbouncer_password.txt
# pgBouncer writes a generated userlist here. It is tmpfs so no credential
# reaches disk, which means it needs the runtime uid: a root-owned tmpfs is
# unwritable by a process that dropped to uid 70.
MDB_ENGINE_POOLER_STATE_DIR=/etc/pgbouncer
MDB_ENGINE_POOLER_UID=100
MDB_ENGINE_POOLING_REQUIRED_IN_PROD=true
# ~10 MB per connection: 500 direct connections cost ~5 GB before a query runs.
MDB_ENGINE_POOLING_RATIONALE='one OS process per connection'

MDB_ENGINE_LICENSE=PostgreSQL
MDB_ENGINE_OSI_APPROVED=true

# Publish policy. `derive` means we build and publish dbpantry-<engine> from
# the upstream base. See SPEC section 22.5.
MDB_ENGINE_PUBLISH=derive

# The upstream entrypoint's own variables, so compose generation wires the
# image's contract without knowing which engine it is dealing with.
MDB_ENGINE_ROOT_PW_ENV=POSTGRES_PASSWORD_FILE
MDB_ENGINE_DEFAULT_DB_ENV=POSTGRES_DB

# Where a mounted conf.d override lands for this engine.
MDB_ENGINE_OVERRIDES_DIR=/etc/postgresql/conf.d/overrides

# Framework connection driver token, for the block new-project prints.
# Laravel calls PostgreSQL 'pgsql', not 'postgres'.
MDB_ENGINE_DRIVER=pgsql

# PITR. Only PostgreSQL has WAL archiving wired; the MySQL family's equivalent
# (binlog-based recovery) is a separate piece of work and is not claimed here.
MDB_ENGINE_PITR_CAPABLE=true
MDB_ENGINE_PITR_REPO_PATH=/var/lib/pgbackrest
