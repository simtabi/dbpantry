    # Healthy when the server answers ping, which needs no authentication, so
    # no credential is involved (design.md D-75). mongosh ships in the image.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--norc", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
