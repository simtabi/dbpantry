# dbpantry PROD overlay.
#
# Three things change from dev, and each is a deliberate default rather than a
# suggestion (SPEC section 7):
#
#   1. NOTHING is published except Caddy. Every engine port binding is removed
#      outright, not moved to localhost -- most database breaches are
#      "accidentally public", and the safest port is the one that does not
#      exist.
#   2. TLS is enforced at the server, so plaintext TCP is refused rather than
#      merely discouraged. Unix sockets remain a secure transport and keep
#      working.
#   3. Resource limits and log caps are on, because an unbounded container on a
#      VPS takes the host with it.
#
# Applied through COMPOSE_FILE, after compose.ha.yml and before
# compose.prod.engines.yml, which gen-compose generates for every engine and
# pooler (design.md D-73). `make init-prod` writes that COMPOSE_FILE; an older
# env file gets it from `make prod-overlay`, and check-env refuses a prod boot
# without it. Until 2026-11-06 nothing put this file in COMPOSE_FILE, so a prod
# `make up` applied none of it.

services:
  pg:
    # !override empties the published-ports list from the base file rather than
    # merging with it. A merge would keep the dev binding.
    ports: !override []
    environment:
      MDB_TLS_ENFORCE: "true"
      # Slow-query logging is dev-on / prod-off (SPEC section 12).
      MDB_PG_SLOW_MS: "0"
    deploy:
      resources:
        limits:
          cpus: "${MDB_PG_CPU_LIMIT:-2}"
          memory: ${MDB_PG_MEM_LIMIT:-4g}

  mysql:
    ports: !override []
    environment:
      MDB_TLS_ENFORCE: "true"
      MDB_MYSQL_SLOW_SECONDS: "0"
    deploy:
      resources:
        limits:
          cpus: "${MDB_MYSQL_CPU_LIMIT:-2}"
          memory: ${MDB_MYSQL_MEM_LIMIT:-2g}

  mariadb:
    ports: !override []
    environment:
      MDB_TLS_ENFORCE: "true"
      MDB_MARIADB_SLOW_SECONDS: "0"
    deploy:
      resources:
        limits:
          cpus: "${MDB_MARIADB_CPU_LIMIT:-2}"
          memory: ${MDB_MARIADB_MEM_LIMIT:-2g}

  # The UIs stay on the internal network with no published port of their own.
  # They are reachable only through Caddy, which is where basic auth lives.
  adminer:
    ports: !override []
  phpmyadmin:
    ports: !override []
  pgadmin:
    ports: !override []

  # Caddy binds the host, and is the only service that does. In prod it serves
  # real certificates and requires basic auth on every UI route.
  caddy:
    ports: !override
      - "${MDB_CADDY_BIND_ADDR:-0.0.0.0}:${MDB_CADDY_HTTP_PORT:-80}:80"
      - "${MDB_CADDY_BIND_ADDR:-0.0.0.0}:${MDB_CADDY_HTTPS_PORT:-443}:443"

  # Connection pooling is MANDATORY under prod, not optional (SPEC section
  # 21.1): roughly 10 MB per direct PostgreSQL connection means ~500
  # connections cost ~5 GB before a single query runs. check-env refuses a prod
  # boot with no pooler configured.
  #
  # This entry USED to define a pgbouncer service of its own, from before the
  # pooler was generated: profiles [prod, ha], aimed at `pg`, with no
  # credential, so wherever it ran it restarted forever beside the working
  # pg-pooler. It is now the HA pooler, defined in compose.ha.yml, and this is
  # its prod hardening only (design.md D-72): TLS enforced whatever the env
  # says, and the same limits as the engines.
  pgbouncer:
    environment:
      MDB_TLS_ENFORCE: "true"
    deploy:
      resources:
        limits:
          cpus: "${MDB_PGBOUNCER_CPU_LIMIT:-1}"
          memory: ${MDB_PGBOUNCER_MEM_LIMIT:-256m}
