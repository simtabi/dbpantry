# Trivy waivers.
#
# Every entry here is a finding the build will NOT fail on. That is a decision
# each time, not a way to quiet the scanner, so the format makes the three
# things that decay impossible to omit:
#
#   id           what is waived
#   purls        WHERE it is waived -- so a waiver for one component cannot
#                silently cover the same CVE somewhere it was never considered
#   statement    why it cannot be fixed here
#   expired_at   when the decision stops being valid
#
# expired_at is the point of this file. The flat .trivyignore this replaced
# carried "revisit on base repin" in a comment, which is a promise rather than
# a mechanism -- nothing read it, and nothing would ever have failed if it were
# quietly ignored for two years. A date is enforced twice: trivy stops applying
# the waiver once it passes, and check 38 fails the harness before that with a
# message naming the entry. Waivers now expire whether or not anyone remembers.
#
# purls scope a waiver to a package. Without them this file is global, and
# accepting a jackson CVE for Cassandra would also accept it in any image that
# grows a jackson dependency later, silently and without anyone deciding to.
# A wrong purl fails safe: the waiver does not match, and the build fails.
#
# Prefer fixing over waiving. Most findings come from base images, so repinning
# a digest in images/bases.tsv resolves them outright -- check that first, and
# only waive when there is demonstrably nothing to repin to.

vulnerabilities:

  # ---------------------------------------------------------------------------
  # Apache Cassandra -- vendored Java dependencies, no waivers
  # ---------------------------------------------------------------------------
  # Cassandra ships its Java dependencies inside lib/. Until 2026-11 the ones
  # below their security fixes were waived here. The image now replaces guava,
  # snappy-java, jackson, netty and lz4-java with fixed releases pinned by
  # sha256 in images/cassandra/jars.tsv (DESIGN.md D-55). A new finding in lib/
  # means a row in jars.tsv needs raising -- do that, do not add a waiver.
  #
  # The last waiver, CVE-2022-1471 for snakeyaml 1.33 on Cassandra 4.1, was
  # removed with 4.1 itself (DESIGN.md D-57): 4.1 cannot take snakeyaml 2.x,
  # so it is no longer maintained here rather than shipped under a waiver.

  # ---------------------------------------------------------------------------
  # gosu, rclone, postgres_exporter -- no waivers, by construction
  # ---------------------------------------------------------------------------
  # These three were waived until 2026-10: their newest releases were built on a
  # Go toolchain older than the standard-library fixes, and rclone and the
  # exporter vendored vulnerable gRPC / x/net / x/crypto. Each image now rebuilds
  # them from the same upstream tags on the pinned toolchain in images/bases.tsv,
  # with those modules raised (DESIGN.md D-51), so the findings are fixed rather
  # than waived. A finding against them now means the toolchain row or a module
  # floor needs raising -- do that, do not re-add a waiver here.
