# dbpantry HA — Patroni, an etcd quorum, and HAProxy.
#
# **This is a REHEARSAL topology, not production HA.** Every node here is on one
# host, so the host is a single point of failure and no amount of Patroni fixes
# that. What it does give you is a real cluster to practise on: a genuine
# leader election, a write port that follows it, and a `patronictl` you can
# break things with before you do it somewhere that matters. SPEC section 21.2
# is explicit about the distinction and the docs must not blur it.
#
# Used as an overlay:
#   docker compose -f docker-compose.yml -f compose.engines.yml -f compose.ha.yml

x-etcd: &etcd
  image: quay.io/coreos/etcd:v3.5.21@sha256:a3ccd299377af4b9968d8cbaaf9722fe354297f11908f74a846075e1e5f4ee89
  profiles: [ha]
  restart: unless-stopped
  networks: [mdb]
  # etcd writes only its own data volume and binds unprivileged ports, so it
  # needs no capability at all (design.md D-75).
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  environment: &etcd_env
    ETCD_INITIAL_CLUSTER: etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
    ETCD_INITIAL_CLUSTER_STATE: new
    ETCD_INITIAL_CLUSTER_TOKEN: mdb-etcd
    ETCD_ENABLE_V2: "false"
    # etcd refuses to serve once its disk fills, and a dev machine's disk does
    # fill. Auto-compaction keeps the history bounded so the cluster does not
    # wedge on something unrelated to the database.
    ETCD_AUTO_COMPACTION_RETENTION: "1"
    ETCD_QUOTA_BACKEND_BYTES: "536870912"
  healthcheck:
    test: ["CMD", "etcdctl", "endpoint", "health"]
    interval: 5s
    timeout: 3s
    retries: 12

x-patroni: &patroni
  build:
    context: ./images
    dockerfile: patroni/Dockerfile
    args:
      ENGINE_VERSION: ${MDB_PG_VERSION:-17}
      IMAGE_PREFIX: ${MDB_IMAGE_PREFIX:-localhost}
  image: ${MDB_IMAGE_PREFIX:-localhost}/dbpantry-patroni:${MDB_PG_VERSION:-17}
  profiles: [ha]
  restart: unless-stopped
  networks: [mdb]
  depends_on:
    etcd1: {condition: service_healthy}
    etcd2: {condition: service_healthy}
    etcd3: {condition: service_healthy}
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
  environment: &patroni_env
    # The data directory is a CHILD of the mounted volume, never the mount
    # point itself. Bootstrapping a replica makes Patroni remove or rename the
    # data directory, and a mount point can be neither -- it fails with
    # "Device or resource busy" and the replica never joins, while the leader
    # looks perfectly healthy.
    PGDATA: /var/lib/postgresql/patroni/pgdata
    PATRONI_SCOPE: ${MDB_HA_CLUSTER_NAME:-mdb-pg}
    PATRONI_ETCD3_HOSTS: "'etcd1:2379','etcd2:2379','etcd3:2379'"
    MDB_PG_SYNC_MODE: ${MDB_PG_SYNC_MODE:-false}
    MDB_TZ: ${MDB_TZ:-UTC}
  volumes:
    - ./certs:/certs:ro
    - ./secrets:/run/secrets:ro
  # Patroni shuts PostgreSQL down itself, and a demotion or a checkpoint is not
  # something to interrupt after Docker's 10s default.
  stop_grace_period: ${MDB_STOP_GRACE:-60s}
  healthcheck:
    # Any Patroni node answering its REST API is healthy; being the LEADER is a
    # different question, and one that changes. A healthcheck that demanded
    # leadership would mark two of three nodes unhealthy by design.
    test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8008/health || exit 1"]
    interval: 5s
    timeout: 3s
    # The window is generous because /health answers 503 until the node is a
    # running member, and a replica is not one until it has finished cloning the
    # leader with pg_basebackup. On a two-core CI runner bootstrapping three
    # PostgreSQL nodes at once, the LAST of them regularly needed longer than
    # the old 60s start_period -- which showed up as "container mdb-patroni3 is
    # unhealthy" while etcd1-3 and haproxy all reported healthy, an outcome that
    # reads like a broken node rather than a slow one.
    #
    # This widens how long the node is allowed to take. It does not change what
    # has to become true: the REST API must still answer, and check 27 still
    # requires a real leader election after the leader is killed.
    retries: 60
    start_period: 120s

services:
  etcd1:
    <<: *etcd
    container_name: ${COMPOSE_PROJECT_NAME:-mdb}-etcd1
    environment:
      <<: *etcd_env
      ETCD_NAME: etcd1
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd1:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd1:2379
    volumes: [etcd1_data:/etcd-data]

  etcd2:
    <<: *etcd
    container_name: ${COMPOSE_PROJECT_NAME:-mdb}-etcd2
    environment:
      <<: *etcd_env
      ETCD_NAME: etcd2
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd2:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd2:2379
    volumes: [etcd2_data:/etcd-data]

  # Three, not two. A two-member etcd cannot form a majority after losing one,
  # so it is strictly LESS available than a single node -- SPEC section 21.2,
  # and check 27 fails on a member count below three rather than warning.
  etcd3:
    <<: *etcd
    container_name: ${COMPOSE_PROJECT_NAME:-mdb}-etcd3
    environment:
      <<: *etcd_env
      ETCD_NAME: etcd3
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd3:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd3:2379
    volumes: [etcd3_data:/etcd-data]

  patroni1:
    <<: *patroni
    container_name: ${COMPOSE_PROJECT_NAME:-mdb}-patroni1
    hostname: patroni1
    environment:
      <<: *patroni_env
      PATRONI_NAME: patroni1
    volumes:
      - patroni1_data:/var/lib/postgresql/patroni
      - ./certs:/certs:ro
      - ./secrets:/run/secrets:ro

  patroni2:
    <<: *patroni
    container_name: ${COMPOSE_PROJECT_NAME:-mdb}-patroni2
    hostname: patroni2
    environment:
      <<: *patroni_env
      PATRONI_NAME: patroni2
    volumes:
      - patroni2_data:/var/lib/postgresql/patroni
      - ./certs:/certs:ro
      - ./secrets:/run/secrets:ro

  patroni3:
    <<: *patroni
    container_name: ${COMPOSE_PROJECT_NAME:-mdb}-patroni3
    hostname: patroni3
    environment:
      <<: *patroni_env
      PATRONI_NAME: patroni3
    volumes:
      - patroni3_data:/var/lib/postgresql/patroni
      - ./certs:/certs:ro
      - ./secrets:/run/secrets:ro

  haproxy:
    image: docker.io/library/haproxy:3.0-alpine@sha256:7c8dac975b9def049d6585b7efe865486acaa7b6ec5e74eec45f08fde8bb2ad4
    container_name: ${COMPOSE_PROJECT_NAME:-mdb}-haproxy
    profiles: [ha]
    restart: unless-stopped
    networks: [mdb]
    depends_on: [patroni1, patroni2, patroni3]
    # The official image runs as the unprivileged haproxy user on ports above
    # 1024: nothing to keep (design.md D-75).
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    volumes:
      - ./config/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "${MDB_BIND_ADDR:-127.0.0.1}:${MDB_HAPROXY_WRITE_PORT:-5432}:5432"
      - "${MDB_BIND_ADDR:-127.0.0.1}:${MDB_HAPROXY_READ_PORT:-5433}:5433"
      - "${MDB_BIND_ADDR:-127.0.0.1}:${MDB_HAPROXY_STATS_PORT:-7000}:7000"
    healthcheck:
      test: ["CMD-SHELL", "haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  # ---------------------------------------------------------------------------
  # The HA pooler (design.md D-72). pgBouncer in front of HAProxy's WRITE port,
  # so pooled connections follow the leader through a failover exactly as
  # direct ones do. The standalone pooler, pg-pooler, points at the `pg`
  # service, which HA replaces, so without this an HA stack had no pooler at all
  # -- and prod requires one.
  #
  # It keeps the name `pgbouncer` from the prod overlay's original placeholder,
  # which predated the generated pooler, pointed at `pg`, had no credential and
  # restarted forever wherever it ran. Clients on the network reach it as
  # `pgbouncer`, a name certs/pg already carries.
  #
  # The environment mirrors engines/postgres/compose-pooler.yml, from which
  # pg-pooler is generated; check 71 fails if the two drift apart. Started by
  # `make up PROFILES=ha,pooler`, which scripts/profiles expands to ha-pooler.
  # ---------------------------------------------------------------------------
  pgbouncer:
    profiles: [ha-pooler]
    image: ${MDB_IMAGE_PREFIX:-localhost}/dbpantry-pgbouncer:dev
    restart: unless-stopped
    depends_on:
      haproxy: {condition: service_healthy}
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # The same four as pg-pooler; CHOWN installs the TLS material for postgres.
    cap_add: [DAC_OVERRIDE, SETUID, SETGID, CHOWN]
    entrypoint: ["/usr/local/bin/mdb-pgbouncer-bootstrap"]
    environment:
      DB_PASSWORD_FILE: /run/secrets/pgbouncer_password.txt
      DB_HOST: haproxy
      DB_PORT: "5432"
      DB_USER: pgbouncer
      LISTEN_PORT: "6432"
      MDB_TLS_ENFORCE: ${MDB_TLS_ENFORCE:-false}
      MDB_MTLS: ${MDB_MTLS:-false}
      AUTH_TYPE: scram-sha-256
      AUTH_USER: pgbouncer
      AUTH_DBNAME: postgres
      AUTH_QUERY: SELECT username, password FROM pgbouncer.get_auth($$1)
      POOL_MODE: ${MDB_PGBOUNCER_POOL_MODE:-transaction}
      DEFAULT_POOL_SIZE: ${MDB_PGBOUNCER_DEFAULT_POOL_SIZE:-25}
      MIN_POOL_SIZE: ${MDB_PGBOUNCER_MIN_POOL_SIZE:-5}
      RESERVE_POOL_SIZE: ${MDB_PGBOUNCER_RESERVE_POOL_SIZE:-5}
      MAX_CLIENT_CONN: ${MDB_PGBOUNCER_MAX_CLIENT_CONN:-1000}
      MAX_DB_CONNECTIONS: ${MDB_PGBOUNCER_MAX_DB_CONNECTIONS:-50}
      MAX_PREPARED_STATEMENTS: ${MDB_PGBOUNCER_MAX_PREPARED_STATEMENTS:-200}
      ADMIN_USERS: pgbouncer
      STATS_USERS: pgbouncer
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options,search_path
      LOG_POOLER_ERRORS: "1"
    tmpfs:
      - /etc/pgbouncer:exec,mode=0700,uid=100,gid=100
    volumes:
      - ./secrets:/run/secrets:ro
      - ./certs:/certs:ro
    # Published like HAProxy's ports, on MDB_BIND_ADDR (loopback by default).
    ports:
      - "${MDB_BIND_ADDR:-127.0.0.1}:${MDB_HA_POOLER_HOST_PORT:-6432}:6432"
    networks: [mdb]
    logging:
      driver: json-file
      options:
        max-size: ${MDB_LOG_MAX_SIZE:-10m}
        max-file: "${MDB_LOG_MAX_FILE:-3}"

volumes:
  etcd1_data:
    name: ${COMPOSE_PROJECT_NAME:-mdb}_etcd1_data
  etcd2_data:
    name: ${COMPOSE_PROJECT_NAME:-mdb}_etcd2_data
  etcd3_data:
    name: ${COMPOSE_PROJECT_NAME:-mdb}_etcd3_data
  # Per node AND per major, for the same reason the standalone volumes are:
  # pointing a new major at an old data directory fails hard.
  patroni1_data:
    name: ${COMPOSE_PROJECT_NAME:-mdb}_patroni1_pg${MDB_PG_VERSION:-17}_data
  patroni2_data:
    name: ${COMPOSE_PROJECT_NAME:-mdb}_patroni2_pg${MDB_PG_VERSION:-17}_data
  patroni3_data:
    name: ${COMPOSE_PROJECT_NAME:-mdb}_patroni3_pg${MDB_PG_VERSION:-17}_data
